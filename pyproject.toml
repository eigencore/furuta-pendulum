[project]
name = "furuta-pendulum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.4.0",
    "matplotlib>=3.11.2",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "pyserial>=3.5",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/furuta"]
